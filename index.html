<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e1b3a" />
    <meta
      name="description"
      content="SUNDIVE — one-button comet racing. Hold to dive, release to soar. Race the ghost down today's canyon of light."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1b3a'/%3E%3Ccircle cx='21' cy='11' r='5.5' fill='%23ffd27a'/%3E%3Cpath d='M4 26 Q12 20 17 14' stroke='%23ff8a5c' stroke-width='3.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>SUNDIVE — hold to dive, release to soar</title>
    <style>
      :root {
        --ink: #0e1b3a;
        --gold: #ffd27a;
        --coral: #ff8a5c;
        --paper: #fff6ea;
        --ghost: #9fd8e8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #0e1b3a; overscroll-behavior: none; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--paper);
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #veil {
        position: fixed; inset: 0; z-index: 40; background: #0e1b3a;
        display: grid; place-items: center; transition: opacity 500ms ease;
      }
      #veil.gone { opacity: 0; pointer-events: none; }
      #veil .sun { width: 54px; height: 54px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 60px 14px rgba(255, 210, 122, 0.45); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="veil" aria-hidden="true"><div class="sun"></div></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
